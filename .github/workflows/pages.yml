name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v6

      - name: Preparar o pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Preparar o Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Gerar o site estático
        env:
          GITHUB_PAGES_EXPORT: 'true'
          GITHUB_PAGES_BASE_PATH: /corrige-facil
        run: pnpm build

      - name: Preparar o GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar os arquivos publicados
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
