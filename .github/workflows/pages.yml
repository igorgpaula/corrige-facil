name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v6

      - name: Preparar o pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Preparar o Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependências da v2.0
        run: pnpm install --frozen-lockfile

      - name: Preparar Java para validar as regras do Firestore
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Iniciar emulador Firestore local, sem credenciais
        run: |
          mkdir -p work/emulator
          curl --fail --silent --show-error --location https://storage.googleapis.com/firebase-preview-drop/emulator/cloud-firestore-emulator-v1.22.0.jar --output work/emulator/firestore.jar
          echo '9b6498b7f62714d67f48f59b3818883cd682dbcd46b9f59511de81c97bb5166c  work/emulator/firestore.jar' | sha256sum --check
          java -Duser.language=en -Duser.country=US -jar work/emulator/firestore.jar --host=127.0.0.1 --port=8788 --project_id=demo-corrige --rules=firestore.rules > work/emulator/firestore.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --silent http://127.0.0.1:8788/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat work/emulator/firestore.log
          exit 1

      - name: Validar testes e tipos da v2.0
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8788
        run: |
          pnpm test
          pnpm exec tsc --noEmit

      - name: Gerar a v2.0
        env:
          GITHUB_PAGES_EXPORT: 'true'
          GITHUB_PAGES_BASE_PATH: /corrige-facil/v2
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
        run: pnpm build

      - name: Baixar a versão clássica
        uses: actions/checkout@v6
        with:
          ref: v1.0.0
          path: v1-source

      - name: Instalar dependências da v1.0
        working-directory: v1-source
        run: pnpm install --frozen-lockfile

      - name: Gerar a v1.0
        working-directory: v1-source
        env:
          GITHUB_PAGES_EXPORT: 'true'
          GITHUB_PAGES_BASE_PATH: /corrige-facil/v1
        run: pnpm build

      - name: Reunir as duas versões
        run: |
          mkdir -p publish/v1 publish/v2
          cp -a v1-source/dist/client/. publish/v1/
          rm -rf publish/v1/_next
          mv publish/v1/corrige-facil/v1/_next publish/v1/_next
          rm -rf publish/v1/corrige-facil
          cp -a dist/client/. publish/v2/
          rm -rf publish/v2/_next
          mv publish/v2/corrige-facil/v2/_next publish/v2/_next
          rm -rf publish/v2/corrige-facil
          cp deployment/index.html publish/index.html
          touch publish/.nojekyll

      - name: Preparar o GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar os arquivos publicados
        uses: actions/upload-pages-artifact@v4
        with:
          path: publish

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
